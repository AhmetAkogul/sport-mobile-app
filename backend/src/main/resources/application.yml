spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/sporapp
    username: ${DB_USERNAME:sporapp_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080


jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

  properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 32